<svg xmlns="http://www.w3.org/2000/svg" width="300" height="480" viewBox="0 0 300 480">
  <!-- BG gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE6F3"/>
      <stop offset="100%" stop-color="#F0C8E8"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDDBB4"/>
      <stop offset="100%" stop-color="#F0B888"/>
    </radialGradient>
  </defs>
  <rect width="300" height="480" fill="url(#bg)" rx="20"/>

  <!-- Back Hair -->
  <ellipse cx="150" cy="140" rx="90" ry="100" fill="#4a3b32"/>

  <!-- Body -->
  <!-- Neck -->
  <rect x="140" y="240" width="20" height="15" fill="url(#skinGrad)" rx="5"/>
  <!-- Torso (small) -->
  <rect x="120" y="250" width="60" height="70" fill="#fff" rx="15" opacity="0.9"/>
  
  <!-- Arms (chibi) -->
  <rect x="100" y="255" width="25" height="50" fill="url(#skinGrad)" rx="12" transform="rotate(15 110 260)"/>
  <rect x="175" y="255" width="25" height="50" fill="url(#skinGrad)" rx="12" transform="rotate(-15 190 260)"/>

  <!-- Hands -->
  <ellipse cx="95" cy="310" rx="12" ry="12" fill="url(#skinGrad)"/>
  <ellipse cx="205" cy="310" rx="12" ry="12" fill="url(#skinGrad)"/>

  <!-- Base bottoms -->
  <rect x="115" y="310" width="70" height="40" fill="#fff" rx="10" opacity="0.85"/>

  <!-- Legs -->
  <rect x="125" y="340" width="18" height="60" fill="url(#skinGrad)" rx="9"/>
  <rect x="157" y="340" width="18" height="60" fill="url(#skinGrad)" rx="9"/>

  <!-- Shoes -->
  <ellipse cx="130" cy="405" rx="20" ry="10" fill="#ddd" rx="5"/>
  <ellipse cx="170" cy="405" rx="20" ry="10" fill="#ddd" rx="5"/>

  <!-- Head (Big) -->
  <ellipse cx="150" cy="150" rx="85" ry="75" fill="url(#skinGrad)"/>

  <!-- Front Hair -->
  <path d="M65 150 Q 80 50 150 50 Q 220 50 235 150 Q 210 90 150 90 Q 90 90 65 150" fill="#4a3b32"/>
  <ellipse cx="100" cy="110" rx="30" ry="40" fill="#4a3b32" transform="rotate(20 100 110)"/>
  <ellipse cx="200" cy="110" rx="30" ry="40" fill="#4a3b32" transform="rotate(-20 200 110)"/>

  <!-- Eyes (Big anime style) -->
  <!-- Whites -->
  <ellipse cx="115" cy="165" rx="18" ry="22" fill="#fff"/>
  <ellipse cx="185" cy="165" rx="18" ry="22" fill="#fff"/>
  <!-- Iris -->
  <ellipse cx="115" cy="167" rx="13" ry="18" fill="#556677"/>
  <ellipse cx="185" cy="167" rx="13" ry="18" fill="#556677"/>
  <!-- Pupil -->
  <ellipse cx="115" cy="167" rx="7" ry="10" fill="#111"/>
  <ellipse cx="185" cy="167" rx="7" ry="10" fill="#111"/>
  <!-- Shines -->
  <ellipse cx="110" cy="158" rx="5" ry="6" fill="#fff"/>
  <ellipse cx="180" cy="158" rx="5" ry="6" fill="#fff"/>
  <ellipse cx="122" cy="175" rx="2" ry="3" fill="#fff" opacity="0.6"/>
  <ellipse cx="192" cy="175" rx="2" ry="3" fill="#fff" opacity="0.6"/>
  
  <!-- Eyelashes -->
  <path d="M95 155 Q 115 135 135 155" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165 155 Q 185 135 205 155" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="90" cy="185" rx="15" ry="8" fill="#FF8FB5" opacity="0.5"/>
  <ellipse cx="210" cy="185" rx="15" ry="8" fill="#FF8FB5" opacity="0.5"/>

  <!-- Mouth (small) -->
  <path d="M145 195 Q 150 200 155 195" stroke="#D4607A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>